version: "3.8"
name: cv_matching_edge
services:
  nginx:
    image: jonasal/nginx-certbot:6.1.0-nginx1.29.5
    container_name: cv_matching_nginx_edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/nginx/templates:/etc/nginx/templates:ro
      - ./data/certbot:/etc/letsencrypt
      - ./data/nginx/user_conf.d/.htpasswd:/etc/nginx/user_conf.d/.htpasswd:ro
    environment:
      CERTBOT_EMAIL: "pavlo.krasko@techcoredev.ru"
      DOMAIN_DEV: ${DOMAIN_DEV:?DOMAIN_DEV is not set}
      DOMAIN_PROD: ${DOMAIN_PROD:?DOMAIN_PROD is not set}
      ENVSUBST_VARS: DOMAIN_DEV,DOMAIN_PROD
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/user_conf.d
      STAGING: "0"
    networks:
      - internal_net_dev
      - internal_net_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  internal_net_dev:
    external: true
  internal_net_prod:
    external: true
