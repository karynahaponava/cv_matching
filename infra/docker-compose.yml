version: "3.8"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cv_matching
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: cv-matching-backend:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/cv_matching
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../google_creds.json:/app/google_creds.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: cv-matching-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ../frontend:/app
    restart: unless-stopped
volumes:
  pg_data: